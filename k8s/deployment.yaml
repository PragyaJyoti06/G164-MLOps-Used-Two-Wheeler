apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp233-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp233-api
  template:
    metadata:
      labels:
        app: mp233-api
    spec:
      containers:
        - name: mp233-api
          image: mp233-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
